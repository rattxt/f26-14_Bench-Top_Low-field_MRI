# =============================================================================
#  OSII v1 / MaRCoS test package - single configuration file
#
#  Every script reads this file. Edit it, then re-run:
#     tools/make_seq.py all      (only needed after changing [sequence]/[bench]
#                                 or a calibration that the bench files use)
#     tools/run_seq.py ...       (reads [network] [hardware] [*_calibration] [run])
#
#  Any value can also be overridden on the command line without editing:
#     --set section.key=value     e.g.  --set run.repeat=10
#
#  Values marked  !! VERIFY  are placeholders; measure them on your system.
#  docs/CONFIGURATION.md explains every key.
# =============================================================================

[network]
# IP address of the SDRLab 122-16 running marcos_server ("localhost" for the simulator)
ip_address = 169.254.101.38          # !! VERIFY
port = 11111

[hardware]
fpga_clk_freq_MHz = 122.88          # SDRLab 122-16; do not change
grad_board = ocra1                  # ocra1 | gpa-fhdo
# Larmor / NCO frequency used for TX and RX (Hz). ~2.1 MHz for the 50 mT OSII magnet.
larmor_freq_Hz = 2.1e6              # !! VERIFY (find with a spectrum/FID sweep)
# OCRA1 SPI update budget (MSPS). 0.2 -> ~3.9 us per OCRA1 frame. Keep grad_t_us above
# 24*(1+spi_div)/122.88 us (the run script checks this and warns).
grad_max_update_rate = 0.2
# Delay of gradient chain (us). Positive values move gradient updates earlier to compensate.
grad_latency_us = 0
# Reset the OCRA1 DACs (outputs to 0 V) when connecting. Recommended after power-up.
init_ocra1 = yes
# Halt anything already running on the SDRLab when connecting.
halt_and_reset = yes

[gradient_calibration]
# How the .seq gradient amplitudes (Hz/m) map to OCRA1 full scale (+1.0 = +10 V).
#   physical : full_scale_Hz/m = 42.577e6 * efficiency * amp_gain * ocra1_full_scale_V
#   direct   : give gx/gy/gz_max_Hz_per_m yourself
mode = physical
ocra1_full_scale_V = 10.0           # AD5781 +/-10 V reference (OCRA1 Rev003 BNC outputs)
amp_gain_A_per_V = 1.5              # TU Delft GA2 transconductance (measured -1.52 A/V: check sign!)
x_efficiency_mT_per_m_per_A = 0.5   # !! VERIFY - gradient coil efficiency, not found in docs
y_efficiency_mT_per_m_per_A = 0.5   # !! VERIFY
z_efficiency_mT_per_m_per_A = 0.5   # !! VERIFY
# used only when mode = direct
gx_max_Hz_per_m = 319000
gy_max_Hz_per_m = 319000
gz_max_Hz_per_m = 319000

[rf_calibration]
# How RF amplitudes (Hz of B1) map to TX full scale (1.0 = SDRLab DAC full scale).
#   flip90 : give the TX fraction that produces a 90 deg hard pulse of rf_90_duration_us
#   direct : give rf_amp_max_Hz (B1 at full scale) yourself
# The TSE uses 1250 Hz (90 deg) and 2500 Hz (180 deg) for 200 us, so with flip90 the
# 180 deg pulses run at 2 x rf_90_fraction. Must be <= 0.5.
mode = flip90
rf_90_fraction = 0.1                # !! VERIFY - start low, calibrate on the scanner
rf_90_duration_us = 200
rf_amp_max_Hz = 12500               # used only when mode = direct

[gradient_mapping]
# Which OCRA1 channel each logical axis drives (vx | vy | vz | vz2) and its polarity (+1/-1).
# The GA2 measured gain is negative; use -1 here if a positive command gives negative current.
x_channel = vx
y_channel = vy
z_channel = vz
x_polarity = 1
y_polarity = 1
z_polarity = 1

[sequence]
# ---- TSE conversion (tools/make_seq.py tse) ----
source = source/sequence.seq        # original OSII / Nexus 3D TSE T2-mapping file
output = seq/tse_3d_t2_marcos.seq
name = tse_3d_t2_mapping_marcos
# tx_gate (OCRA1 TXGATE BNC -> T/R switch + RFPA enable buffer) goes high this many us
# before each RF pulse and low at the end of the pulse. Max ~2100 us for this sequence.
tx_warmup_us = 100
# Pure delay at the very start of the sequence (>= tx_warmup_us + 10)
lead_in_us = 1000
# Which TRs of the source to keep: first_tr (0-based) and n_tr (0 = all 440)
first_tr = 0
n_tr = 0
# New repetition time in ms (0 = keep the original 1250 ms). Min ~186.4 ms.
tr_ms = 0
# Amplitude multipliers for bench work (0 removes the channel entirely, 1 = original)
rf_scale = 1.0
gx_scale = 1.0
gy_scale = 1.0
gz_scale = 1.0
adc_enable = yes
# ADC oversampling factor. 0 = automatic: the smallest factor that brings the dwell
# below the MaRCoS limit of 33.3 us (the OSII readout is 44 x 50 us -> 88 x 25 us).
# The ADC window (start, length) is unchanged; run_seq.py averages back to 44 points.
adc_oversampling = 0

[bench]
# ---- bench sequences (tools/make_seq.py bench) ----
# Gradient tests: trapezoids at grad_fraction of OCRA1 full scale
grad_fraction = 0.1                 # 0.1 -> 1.0 V on OCRA1 -> 1.5 A from GA2
grad_rise_us = 250
grad_flat_us = 2000
grad_gap_us = 5000
grad_repeats = 20
grad_hold_ms = 500                  # DC hold test length (GA2 limit: 30 % duty)
# RF tests: hard pulses at rf_fraction of TX full scale
rf_fraction = 0.1
rf_duration_us = 200
rf_period_us = 10000                # 2 % duty; RFPA limit is 10 % duty and 20 ms pulses
rf_repeats = 50
loopback_dwell_us = 3.125           # multiple of 1/122.88 us (exact on MaRCoS)
loopback_pad_us = 50                # ADC opens/closes this long before/after the pulse
# One-TR TSE debug files: which source TR and the shortened TR
tse_debug_tr = 0                    # 0 = ky edge, kz = 0 ; 220 = ky 0, kz 0 (k-space centre)
tse_debug_tr_ms = 500                # keep GA2 duty low: Gz crushers = 56 ms per TR (11 % at 500 ms)

[run]
# ---- tools/run_seq.py ----
seq_file = seq/tse_3d_t2_marcos.seq
# Gradient raster used by marga_pulseq to sample trapezoid ramps (us). 10 is a good
# compromise for OCRA1; smaller values give smoother ramps but more SPI traffic.
grad_t_us = 10
# Snap all gradient updates (all channels) onto a common grid of this many us.
# Needed with OCRA1: two channels ramping with different ramp times would otherwise
# send updates a few us apart, faster than OCRA1 can take them (dropped samples).
# Shifts ramp samples by <= grad_snap_us/2. 0 = off.
grad_snap_us = 10
# Run the whole sequence this many times (useful with short bench files + a scope)
repeat = 1
# Pause between repeats (s)
repeat_pause_s = 0.0
# Extra scope trigger on the SDRLab trig_out pin: none | sequence | tr | rf
scope_trigger = tr
scope_trigger_width_us = 10
# Also drive rx_gate high while the ADC is open (scope marker / receiver blanking)
rx_gate_follows_adc = yes
# Scan the SDRLab LEDs as the sequence progresses
auto_leds = yes
output_dir = data
reports_dir = reports
# Time window plotted by "run_seq.py plot" (ms, relative to sequence start)
plot_start_ms = 0
plot_stop_ms = 40
